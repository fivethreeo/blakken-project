name: Build Maharaja Android

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: HTTPS API base URL reachable from the Android device
        required: true
        type: string
      restaurant_app_id:
        description: Maharaja restaurant app ID
        required: true
        type: string
      websocket_base_url:
        description: Public WebSocket base URL for live shop updates
        required: true
        default: wss://blakken.cavabonga.no/ws/
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: restaurant-apps/maharaja/android
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          RESTAURANT_APP_ID: ${{ inputs.restaurant_app_id }}
          WEBSOCKET_BASE_URL: ${{ inputs.websocket_base_url }}
        run: >-
          gradle --no-daemon assembleDebug
          -PBLAKKEN_API_BASE_URL="$API_BASE_URL"
          -PMAHARAJA_APP_ID="$RESTAURANT_APP_ID"
          -PBLAKKEN_WS_BASE_URL="$WEBSOCKET_BASE_URL"
          -PPLAY_INTEGRITY_REQUIRED=false
          -PPLAY_INTEGRITY_CLOUD_PROJECT_NUMBER=0
          -PAPP_REGISTRATION_ID=

      - uses: actions/upload-artifact@v4
        with:
          name: maharaja-android-debug
          path: restaurant-apps/maharaja/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
