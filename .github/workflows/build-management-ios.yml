name: Build Management iOS

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: HTTPS API base URL reachable from the iPhone
        required: true
        type: string
      websocket_base_url:
        description: WebSocket base URL reachable from the iPhone
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: management-apps/ios
        run: xcodegen generate --spec project.yml

      - name: Build iOS device app
        working-directory: management-apps/ios
        run: >-
          xcodebuild
          -project BlakkenManagement.xcodeproj
          -scheme BlakkenManagement
          -destination 'generic/platform=iOS'
          -sdk iphoneos
          -configuration Release
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          "CURRENT_PROJECT_VERSION=${{ github.run_number }}.${{ github.run_attempt }}"
          INFOPLIST_KEY_APP_ATTEST_REQUIRED=NO
          INFOPLIST_KEY_APP_REGISTRATION_ID=""
          build

      - name: Configure API and WebSocket base URLs
        working-directory: management-apps/ios
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          WEBSOCKET_BASE_URL: ${{ inputs.websocket_base_url }}
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          app = Path("build/Build/Products/Release-iphoneos/BlakkenManagement.app")
          info_path = app / "Info.plist"
          with info_path.open("rb") as info_file:
              info = plistlib.load(info_file)
          info["API_BASE_URL"] = os.environ["API_BASE_URL"]
          info["TS_WS_BACKEND_URL"] = os.environ["WEBSOCKET_BASE_URL"]
          info["APP_ATTEST_REQUIRED"] = False
          info["APP_REGISTRATION_ID"] = ""
          with info_path.open("wb") as info_file:
              plistlib.dump(info, info_file)
          with info_path.open("rb") as info_file:
              configured = plistlib.load(info_file)
          assert configured["API_BASE_URL"] == os.environ["API_BASE_URL"]
          assert configured["TS_WS_BACKEND_URL"] == os.environ["WEBSOCKET_BASE_URL"]
          assert configured["APP_ATTEST_REQUIRED"] is False
          assert configured["APP_REGISTRATION_ID"] == ""
          PY

      - name: Package unsigned IPA for SideStore
        working-directory: management-apps/ios
        run: |
          mkdir -p build/ipa/Payload
          ditto build/Build/Products/Release-iphoneos/BlakkenManagement.app build/ipa/Payload/BlakkenManagement.app
          cd build/ipa
          zip -qry "$GITHUB_WORKSPACE/management-apps/ios/BlakkenManagement.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: management-ios-sidestore-ipa
          path: management-apps/ios/BlakkenManagement.ipa
          if-no-files-found: error
