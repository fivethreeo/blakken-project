name: Build Management Android

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: HTTPS API base URL reachable from the Android device
        required: true
        type: string
      websocket_base_url:
        description: WebSocket base URL reachable from the Android device
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: management-apps/android
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          WEBSOCKET_BASE_URL: ${{ inputs.websocket_base_url }}
        run: >-
          gradle --no-daemon assembleDebug
          -PBLAAKEN_API_BASE_URL="$API_BASE_URL"
          -PBLAAKEN_WS_BASE_URL="$WEBSOCKET_BASE_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: management-android-debug
          path: management-apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
