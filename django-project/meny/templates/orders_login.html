{% load rsbuild %}<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logg inn · Bestillinger</title>
  {% rsbuild_entry 'index' %}
</head>
<body>
  <main class="menu-shell orders-shell orders-login center stack">
    <header class="menu-heading stack">
      <h1>Logg inn</h1>
      <p>Bestillinger · kun ansatte</p>
    </header>
    <form class="order-card box stack" method="post" action="{% url 'orders-login' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      {% if form.non_field_errors %}<div role="alert">{{ form.non_field_errors }}</div>{% endif %}
      <label class="stack dish-editor-field" for="{{ form.username.id_for_label }}">Brukernavn
        {{ form.username }}
        {{ form.username.errors }}
      </label>
      <label class="stack dish-editor-field" for="{{ form.password.id_for_label }}">Passord
        {{ form.password }}
        {{ form.password.errors }}
      </label>
      <div class="reader-controls cluster align-items:center">
        <button type="submit">Logg inn</button>
        <a href="{% url 'index' %}">Til menyen</a>
      </div>
    </form>
  </main>
</body>
</html>
