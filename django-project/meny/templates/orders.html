{% load rsbuild %}<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bestillinger</title>
  {% rsbuild_entry 'index' %}
</head>
<body class="no-js" data-ts-ws-backend-url="{{ ts_ws_backend_url }}">
  <script>document.body.classList.replace('no-js', 'with-js');</script>
  <main class="menu-shell orders-shell center stack" data-orders data-orders-url="{% url 'order-list' %}"
    data-shop-url="{% url 'shop-status' %}" data-shop-open="{{ shop.is_open|yesno:'true,false' }}"
    data-shop-message="{{ shop.message }}">
    <header class="cluster align-items:center justify-content:space-between">
      <div class="menu-heading stack">
        <h1>Bestillinger</h1>
        <p data-orders-connection role="status">Kobler til …</p>
      </div>
      <nav class="reader-controls cluster align-items:center" aria-label="Bestillingsvalg">
        <a href="{% url 'index' %}">Til menyen</a>
        <label>Vis
          <select data-orders-filter>
            <option value="active">Aktive</option>
            <option value="all">Alle</option>
            {% for value, label in statuses %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
          </select>
        </label>
        <button type="button" data-orders-refresh>Oppdater</button>
        <span data-shop-status role="status"></span>
        <button type="button" data-shop-toggle disabled>Butikkstatus …</button>
        <form method="post" action="{% url 'orders-logout' %}">
          {% csrf_token %}
          <button type="submit">Logg ut</button>
        </form>
      </nav>
    </header>
    <noscript>Slå på JavaScript for å se og behandle bestillinger.</noscript>
    <p class="render-error" data-orders-error role="alert" hidden></p>
    <p data-orders-empty hidden>Ingen bestillinger.</p>
    <div class="grid orders-grid" data-orders-list></div>
    <nav class="reader-controls cluster align-items:center justify-content:space-between" aria-label="Sider med bestillinger">
      <button type="button" data-orders-previous disabled>Forrige</button>
      <p data-orders-page>Side 1</p>
      <button type="button" data-orders-next disabled>Neste</button>
    </nav>
    <dialog class="menu-editor cart-editor imposter contain box" data-order-cancel-dialog
      aria-labelledby="order-cancel-title" aria-describedby="order-cancel-message">
      <div class="stack">
        <h2 id="order-cancel-title">Kanseller bestilling?</h2>
        <p id="order-cancel-message" data-order-cancel-message></p>
        <div class="reader-controls cluster align-items:center">
          <button type="button" data-order-cancel-close>Behold bestilling</button>
          <button type="button" data-order-cancel-confirm>Kanseller bestilling</button>
        </div>
      </div>
    </dialog>
    <template data-order-card>
      <article class="order-card box stack">
        <header class="cluster align-items:baseline justify-content:space-between">
          <h2 data-order-title></h2>
          <strong data-order-status></strong>
        </header>
        <time data-order-created></time>
        <div class="cluster align-items:baseline">
          <strong data-order-customer></strong>
          <p data-order-phone></p>
        </div>
        <p class="order-note" data-order-note></p>
        <ul class="stack order-items" data-order-items></ul>
        <footer class="cluster align-items:center justify-content:space-between">
          <p>Sum: <strong data-order-total></strong></p>
          <div class="reader-controls cluster align-items:center" data-order-actions></div>
        </footer>
      </article>
    </template>
  </main>
</body>
</html>
