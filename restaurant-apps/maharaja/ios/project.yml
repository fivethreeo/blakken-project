name: Maharaja
options:
  bundleIdPrefix: no.blakken.restaurants
  deploymentTarget:
    iOS: "17.0"
targets:
  Maharaja:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.blakken.restaurants.maharaja
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_API_BASE_URL: "http://localhost:8000/"
        INFOPLIST_KEY_RESTAURANT_APP_ID: "REPLACE_WITH_RESTAURANT_APP_ID"
