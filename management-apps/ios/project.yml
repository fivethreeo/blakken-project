name: BlakkenManagement
options:
  bundleIdPrefix: no.blakken
  deploymentTarget:
    iOS: "17.0"
targets:
  BlakkenManagement:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.blakken.management
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_API_BASE_URL: "http://localhost:8000/"
