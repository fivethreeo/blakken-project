name: BlakkenManagement
options:
  bundleIdPrefix: no.blakken
  deploymentTarget:
    iOS: "17.0"
targets:
  BlakkenManagement:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.blakken.management
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_API_BASE_URL: "http://localhost:8000/"
        INFOPLIST_KEY_TS_WS_BACKEND_URL: "ws://localhost:8002/"
        # Official distribution must sign with AppAttest.production.entitlements.
        # SideStore workflows explicitly disable verification.
        INFOPLIST_KEY_APP_ATTEST_REQUIRED: YES
        INFOPLIST_KEY_APP_REGISTRATION_ID: ""
